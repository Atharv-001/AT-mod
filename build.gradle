plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'   // Loom 1.10 (supports MC 1.21.1+) :contentReference[oaicite:3]{index=3}
    id 'maven-publish'
}

version = project.mod_version
group   = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Only needed if pulling in other mod APIs
    maven { url 'https://maven.shedaniel.me' }
}

fabricApi {
    // Enable Fabric API's data generation DSL
    configureDataGeneration()
}

dependencies {
    // Core mappings & loader
    minecraft    "com.mojang:minecraft:${project.minecraft_version}"
    mappings      "net.fabricmc:yarn:${project.yarn_mappings}:v2"    // Yarn deobf mappings :contentReference[oaicite:4]{index=4}
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Other mod dependencies
    modCompileOnly   "me.shedaniel:RoughlyEnoughItems-api-fabric:16.0.777"
    modRuntimeOnly   "me.shedaniel:RoughlyEnoughItems-fabric:16.0.777"
    modApi           "dev.architectury:architectury-fabric:13.0.8"
    modApi           "me.shedaniel.cloth:cloth-config-fabric:15.0.140"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
        // Configure your publishing repo(s) here
    }
}
